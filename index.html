<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site de Clima</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <section class="card">
      <h1>Clima Agora</h1>
      <p>Digite uma cidade para ver o clima atual.</p>

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Ex: Belém">
        <button id="searchButton">Buscar</button>
        <button id="locationButton">📍</button>
      </div>

      <div id="weatherResult" class="weather-result">
        <p class="empty-message">Nenhuma cidade pesquisada ainda.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
